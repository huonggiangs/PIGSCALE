## idf_component.yml — PIG WEIGH (tái sử dụng bring-up phần cứng từ CÂN MÁY XÚC V3)
## Khai báo các IDF managed components cần thiết
dependencies:
  idf: ">=5.4.0"

  ## LVGL v9 + ESP LVGL Port (hỗ trợ MIPI-DSI trên P4)
  lvgl/lvgl: "~9.2.0"
  ## Ghim 2.4.x: 2.8.0 dùng LV_COLOR_FORMAT_RGB565_SWAPPED chỉ có trong LVGL 9.3+
  espressif/esp_lvgl_port: "~2.4.0"

  ## Touch driver abstraction layer (cần cho esp_lcd_touch.h)
  espressif/esp_lcd_touch: ">=1.0.0"

  ## GT911/GT9271 touch driver (GT9271 tương thích hoàn toàn với GT911)
  espressif/esp_lcd_touch_gt911: ">=1.0.0"

  ## Panel driver JD9365 (Jadard) — MIPI-DSI 2-lane, 800×1280, panel 10.1" Waveshare.
  ## PHẢI dùng bản waveshare, KHÔNG dùng espressif/esp_lcd_jd9365: đã xác nhận qua
  ## dự án tham chiếu E:\Project\ESP32P4YOLO26n (cùng board Waveshare
  ## ESP32-P4-WIFI6-POE-ETH, đã chạy ổn định) — bản waveshare còn tự bật đèn nền
  ## qua IC I2C 0x45 trong lúc init (board này KHÔNG có GPIO điều khiển đèn nền).
  ## Macros API giống hệt bản espressif: JD9365_PANEL_BUS_DSI_2CH_CONFIG,
  ## JD9365_800_1280_PANEL_60HZ_DPI_CONFIG, esp_lcd_new_panel_jd9365().
  waveshare/esp_lcd_jd9365_10_1: "*"
